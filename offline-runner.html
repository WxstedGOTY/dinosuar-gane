<title>Offline Runner</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

<style>
/* Offline Runner -- personal project, self-contained, no external assets. */

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  /* The game owns the window; nothing here should ever scroll. */
  overflow: hidden;
  background: #fff;
  color: #535353;
  font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.6s ease;

  /* Colours for the chrome around the canvas. They follow the game rather than
     the device, because night mode repaints the whole window. */
  --ui-fg: #535353;
  --ui-bg: #fff;
  --ui-line: #c4c4c4;
  color-scheme: light;
}

/* Night. The page goes with the canvas so the game reads as filling the
   screen rather than sitting in a lit border. Inverting white gives exactly
   black, so these two have to agree precisely. */
body.inverted {
  background: #000;
  --ui-fg: #cfcfcf;
  --ui-bg: #000;
  --ui-line: #454545;
  color-scheme: dark;
}

.page {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.runner-container {
  position: relative;
  /* Fill the window, but never so wide that the 4:1 game outgrows its height. */
  width: min(100vw, calc(100vh * 4));
}

.runner-canvas {
  display: block;
  /* Size comes from the script: it picks a whole-number scale so the pixels
     stay exact. Leaving it to CSS reintroduces the fractional one. */
  margin: 0 auto;
  background: #fff;
  /* Square, hard-edged pixels at any scale. */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: pointer;
  transition: filter 0.6s ease;
}

body.inverted .runner-canvas {
  filter: invert(1);
}

/* ------------------------------------------------------------- Settings -- */

/* Pinned to the window's top right, clear of the score inside the canvas. */
.settings {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  font-size: 10px;
  line-height: 1.3;
  color: var(--ui-fg);
}

.settings__toggle {
  display: block;
  width: 14px;
  height: 14px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  opacity: 0.4;
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.settings__toggle svg {
  display: block;
  width: 100%;
  height: 100%;
  fill: currentColor;
}

.settings__toggle:hover,
.settings__toggle:focus-visible {
  opacity: 1;
}

.settings__toggle[aria-expanded="true"] {
  opacity: 1;
}

.settings__badge {
  padding: 0 3px;
  border: 1px solid currentColor;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.08em;
  opacity: 0.55;
}

.settings__panel {
  position: absolute;
  top: 20px;
  right: 0;
  width: 124px;
  padding: 5px 7px 6px;
  border: 1px solid var(--ui-line);
  background: var(--ui-bg);
  text-align: left;
}

.settings__panel[hidden] {
  display: none;
}

.settings__heading {
  margin: 0 0 4px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.5;
}

.settings__option {
  display: flex;
  gap: 5px;
  padding: 2px 0;
  font-size: 10px;
  cursor: pointer;
}

.settings__option input {
  flex: none;
  width: 10px;
  height: 10px;
  margin: 1px 0 0;
  accent-color: currentColor;
}

.settings__option strong {
  display: block;
  font-weight: 600;
}

.settings__desc {
  display: block;
  font-size: 9px;
  opacity: 0.55;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ----------------------------------------------------------------- Hint -- */

.hint {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 2;
  margin: 0;
  font-size: 10px;
  white-space: nowrap;
  color: var(--ui-fg);
  opacity: 0.4;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

/* Out of the way once a run is under way. */
body.playing .hint {
  opacity: 0;
}

.hint kbd {
  display: inline-block;
  min-width: 15px;
  padding: 1px 4px;
  border: 1px solid currentColor;
  font: inherit;
  font-size: 9px;
  text-align: center;
}

/* A narrow window cannot fit the hint on one line; the controls are
   discoverable enough without it. */
@media (max-width: 560px) {
  .hint {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .runner-canvas,
  body,
  .hint {
    transition: none;
  }
}
</style>

<main class="page">
  <div class="runner-container">
    <canvas class="runner-canvas" role="img"
            aria-label="A running dinosaur jumping over cacti"></canvas>

    <div class="settings">
      <button type="button" class="settings__toggle" aria-expanded="false"
              aria-controls="settings-panel" title="Game settings">
        <span class="visually-hidden">Game settings</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M19.14 12.94a7.4 7.4 0 0 0 0-1.88l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.23.41.47.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.12-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/>
        </svg>
      </button>

      <span class="settings__badge" hidden>AUTO</span>

      <div class="settings__panel" id="settings-panel" role="group"
           aria-label="Mode" hidden>
        <p class="settings__heading">Mode</p>

        <label class="settings__option">
          <input type="radio" name="mode" value="normal" checked>
          <span>
            <strong>Normal</strong>
            <span class="settings__desc">You play it.</span>
          </span>
        </label>

        <label class="settings__option">
          <input type="radio" name="mode" value="hack">
          <span>
            <strong>Hack mode</strong>
            <span class="settings__desc">It plays itself.</span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <p class="hint">
    <kbd>Space</kbd> or <kbd>&uarr;</kbd> to jump &middot;
    <kbd>&darr;</kbd> to duck &middot;
    <kbd>M</kbd> to mute &middot;
    tap to play on touch
  </p>
</main>

  // ---------------------------------------------------------------- Restart --

  /**
   * The circular-arrow restart button.
   *
   * The modern sprite sheet carries a browser logo in this slot rather than the
   * arrow the classic game shows, so this one is generated: a ring of whole
   * cells with a bite out of the top right and an arrow head on the loose end.
   * Built cell by cell so it sits with the rest of the artwork instead of
   * being a smooth arc.
   * @param {number} size grid cells across
   * @return {!Array<string>}
   */
  function buildRestartGrid(size) {
    var centre = (size - 1) / 2;
    var outer = size / 2 - 1;
    var inner = outer - 4;
    var gapFrom = -Math.PI * 0.46;
    var gapTo = -Math.PI * 0.17;

    var cells = [];
    var x, y;
    for (y = 0; y < size; y++) {
      cells.push([]);
      for (x = 0; x < size; x++) {
        var dx = x - centre;
        var dy = y - centre;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var angle = Math.atan2(dy, dx);
        cells[y].push(dist <= outer && dist >= inner &&
                      !(angle >= gapFrom && angle <= gapTo));
      }
    }

    // Arrow head capping the open end, pointing the way the ring turns.
    var mid = (outer + inner) / 2;
    var baseX = centre + Math.cos(gapFrom) * mid;
    var baseY = centre + Math.sin(gapFrom) * mid;
    var half = (outer - inner) / 2 + 1.2;
    var reach = 7.5;
    for (y = 0; y < size; y++) {
      for (x = 0; x < size; x++) {
        var ax = x - baseX;
        var ay = y - baseY;
        if (ax >= -0.7 && ax <= reach &&
            Math.abs(ay) <= half * (1 - ax / reach) + 0.4) {
          cells[y][x] = true;
        }
      }
    }

    var grid = [];
    for (y = 0; y < size; y++) {
      var row = '';
      for (x = 0; x < size; x++) {
        row += cells[y][x] ? '#' : '.';
      }
      grid.push(row);
    }
    return grid;
  }

  // ------------------------------------------------------------- Rasterising --

  /**
   * Turn a pixel grid into an offscreen canvas.
   * @param {!Array<string>} grid
   * @param {string} colour
   * @return {!HTMLCanvasElement}
   */
  function rasterise(grid, colour) {
    var cols = grid[0].length;
    var rows = grid.length;
    var canvas = document.createElement('canvas');
    canvas.width = cols;
    canvas.height = rows;

    var ctx = canvas.getContext('2d');
    ctx.fillStyle = colour;

    for (var y = 0; y < rows; y++) {
      var row = grid[y];
      var runStart = -1;
      // Batch horizontal runs into single fillRect calls.
      for (var x = 0; x <= cols; x++) {
        var solid = x < cols && row.charAt(x) === '#';
        if (solid && runStart === -1) {
          runStart = x;
        } else if (!solid && runStart !== -1) {
          ctx.fillRect(runStart, y, x - runStart, 1);
          runStart = -1;
        }
      }
    }
    return canvas;
  }

  var Sprites = {

    build: function () {
      this.images = {

      this.glyphs = {};
      for (var ch in FONT) {
        if (Object.prototype.hasOwnProperty.call(FONT, ch)) {
          this.glyphs[ch] = rasterise(FONT[ch], INK);
        }
      }
    },

    /**
     * Width in pixels of a string rendered with the score glyphs.
     * @param {string} text
     * @return {number}
     */
    measureText: function (text) {
      var advance = this.FONT_WIDTH + this.LETTER_SPACING;
      return text.length * advance - this.LETTER_SPACING;
    },

    /**
     * Draw a string using the score glyphs. Only digits, H and I exist.
     * @param {!CanvasRenderingContext2D} ctx
     * @param {string} text
     * @param {number} x
     * @param {number} y
     */
    drawText: function (ctx, text, x, y) {
      var advance = this.FONT_WIDTH + this.LETTER_SPACING;
      for (var i = 0; i < text.length; i++) {
        var glyph = this.glyphs[text.charAt(i)];
        if (glyph) {
          ctx.drawImage(glyph, Math.round(x + i * advance), Math.round(y));
        }
      }
    }
  };

<script>
/*
 * autopilot.js -- "hack mode".
 *
 * Rather than reacting at a hand-tuned distance, this rolls the world forward
 * and asks what actually survives. Every frame it answers three questions:
 *
 *   - does doing nothing survive the next HORIZON frames?
 *   - does ducking and holding it survive?
 *   - does jumping survive, and how much longer could it be put off?
 *
 * The prediction runs the same jump physics the live T-Rex uses
 * (Trex.predictJump) and the same collision boxes, so it cannot drift out of
 * sync with the game.

(function (global) {
  'use strict';

  // Frames of lookahead. Long enough to contain a whole jump arc at top speed.
  var HORIZON = 70;

  // Slack around obstacles when planning, to absorb the odd dropped frame.
  var MARGIN_X = 4;
  var MARGIN_Y = 2;

  // The live game moves obstacles by Math.floor(speed * frames), so the true
  // per-frame step is either floor(speed) or one pixel more depending on how
  // long the frame took. Planning against a single average drifts several
  // pixels over a jump arc, which is enough to clip a cactus, so every plan is
  // checked against both extremes and only counts as safe if it survives both.
  var STEP_VARIANTS = 2;

  // How far ahead to look when measuring how much longer a jump can be put
  // off, and how many of those frames to leave unspent when committing.
  var MAX_DELAY = 12;
  var LATE_CUSHION = 3;

  function intersects(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  /**
   * @param {!Object} runner
   * @constructor
   */
  function Autopilot(runner) {
    this.runner = runner;
    this.enabled = false;

    this.arc = null;
    this.arcKey = -1;
  }

  Autopilot.prototype = {
    /** The jump arc only changes as the game speeds up, so cache it. */
    jumpArc: function (speed) {
      var key = Math.round(speed * 50);
      if (this.arcKey !== key) {
        this.arc = this.runner.trex.predictJump(speed, HORIZON + 5);
        this.arcKey = key;
      }
      return this.arc;
    },

    /** Freeze the obstacle queue into plain numbers for the simulation. */
    snapshot: function (speed) {
      var live = this.runner.horizon.obstacles;
      var trexX = this.runner.trex.xPos;
      var out = [];
      for (var i = 0; i < live.length; i++) {
        var o = live[i];
        // Anything already behind the T-Rex can never be hit again.
        if (o.xPos + o.width < trexX) continue;

        var slow = Math.floor(speed + o.speedOffset);
        out.push({
          x: o.xPos,
          y: o.yPos,
          steps: [slow, slow + 1],
          size: o.size,
          unitWidth: o.typeConfig.width,
          width: o.width,
          height: o.typeConfig.height,
          boxes: o.typeConfig.collisionBoxes
        });
      }
      return out;
    },

    /**
     * Collision test for one simulated frame.
     * @param {number} trexY
     * @param {boolean} ducking
     * @param {!Array<!Object>} obstacles
     * @param {number} frame how many frames the obstacles have advanced
     * @param {number} variant which per-frame obstacle step to assume
     * @return {boolean}
     */
    hits: function (trexY, ducking, obstacles, frame, variant) {
      var trex = this.runner.trex;
      var boxes = ducking ? trex.collisionBoxes.DUCKING : trex.collisionBoxes.RUNNING;
      // Ducking occupies the same cell as standing -- only the width and the
      // collision boxes change, not where the sprite sits.
      var ty = trexY;
      var tw = ducking ? trex.config.WIDTH_DUCK : trex.config.WIDTH;
      var th = trex.config.HEIGHT;

      for (var i = 0; i < obstacles.length; i++) {
        var o = obstacles[i];
        var ox = o.x - o.steps[variant] * frame;

        // Whole-obstacle rejection before the per-part boxes.
        if (!intersects(trex.xPos, ty, tw, th,
                        ox - MARGIN_X, o.y - MARGIN_Y,
                        o.width + MARGIN_X * 2, o.height + MARGIN_Y * 2)) {
          continue;
        }

        for (var u = 0; u < o.size; u++) {
          var ux = ox + u * o.unitWidth;
          for (var b = 0; b < o.boxes.length; b++) {
            var ob = o.boxes[b];
            for (var t = 0; t < boxes.length; t++) {
              var tb = boxes[t];
              if (intersects(
                    trex.xPos + tb.x, ty + tb.y, tb.width, tb.height,
                    ux + ob.x - MARGIN_X, o.y + ob.y - MARGIN_Y,
                    ob.width + MARGIN_X * 2, ob.height + MARGIN_Y * 2)) {
                return true;
              }
            }
          }
        }
      }
      return false;
    },

    /**
     * Roll the world forward and report whether a plan survives.
     * @param {string} plan 'run', 'duck' or 'jump'
     * @param {number} delay frames to wait before a jump starts
     * @param {number=} horizon frames to look ahead, defaults to HORIZON
     * @return {boolean}
     */
    survives: function (plan, delay, horizon) {
      var trex = this.runner.trex;
      var speed = this.runner.currentSpeed;
      var obstacles = this.snapshot(speed);
      if (!obstacles.length) return true;

      var frames = horizon || HORIZON;
      var arc = plan === 'jump' ? this.jumpArc(speed) : null;
      var ducking = plan === 'duck';
      var target = obstacles[0];

      for (var v = 0; v < STEP_VARIANTS; v++) {
        for (var f = 1; f <= frames; f++) {
          var y = trex.groundYPos;
          if (arc) {
            var step = f - delay - 1;
            if (step >= 0) {
              y = step < arc.length ? arc[step] : trex.groundYPos;
            }
          }
          if (this.hits(y, ducking, obstacles, f, v)) return false;

          // Stop once the obstacle being planned around has gone by and the
          // T-Rex is back on the ground. Whatever is further out gets its own
          // decision on a later frame, and a plan that only has to survive one
          // action cannot be judged on obstacles it will jump separately --
          // doing so rejects every option and leaves nothing but panic jumps.
          if (y >= trex.groundYPos &&
              target.x - target.steps[v] * f + target.width < trex.xPos) {
            break;
          }
        }
      }
      return true;
    },

    /**
     * Walk one full plan and report whether it survives: finish the fall the
     * T-Rex is already in, land, wait, then jump again.
     * @param {!Array<number>} fall remaining descent, ending on the ground
     * @param {!Array<number>} jump arc of the re-jump
     * @param {number} jumpFrame frame the re-jump starts on
     * @param {!Array<!Object>} obstacles
     * @return {boolean}
     */
    pathSurvives: function (fall, jump, jumpFrame, obstacles) {
      var trex = this.runner.trex;
      var target = obstacles[0];

      for (var v = 0; v < STEP_VARIANTS; v++) {
        for (var f = 1; f <= HORIZON; f++) {
          var y;
          if (f <= fall.length) {
            y = fall[f - 1];
          } else if (f < jumpFrame) {
            y = trex.groundYPos;
          } else {
            var step = f - jumpFrame;
            y = step < jump.length ? jump[step] : trex.groundYPos;
          }

          if (this.hits(y, false, obstacles, f, v)) return false;

          if (y >= trex.groundYPos && f >= jumpFrame &&
              target.x - target.steps[v] * f + target.width < trex.xPos) {
            break;
          }
        }
      }
      return true;
    },

    /**
     * Mid-air, is there any way out of this jump? Tries landing and re-jumping
     * at every opportunity.
     * @param {boolean} speedDrop whether to fall fast
     * @return {boolean}
     */
    recoverable: function (speedDrop) {
      var trex = this.runner.trex;
      var speed = this.runner.currentSpeed;
      var obstacles = this.snapshot(speed);
      if (!obstacles.length) return true;

      var fall = trex.predictArc(trex.yPos, trex.jumpVelocity, speedDrop, HORIZON);
      var jump = this.jumpArc(speed);

      for (var d = 0; d <= MAX_DELAY; d++) {
        if (this.pathSurvives(fall, jump, fall.length + d, obstacles)) return true;
      }
      return false;
    },

    /**
     * How many more frames the T-Rex could wait and still clear everything.
     * @return {number} largest safe delay, capped at MAX_DELAY
     */
    slack: function () {
      for (var d = 1; d <= MAX_DELAY; d++) {
        if (!this.survives('jump', d)) return d - 1;
      }
      return MAX_DELAY;
    },

    /** One decision. Called once per frame while hack mode is on. */
    step: function () {
      var r = this.runner;
      if (!this.enabled) return;

      // Keep a run going: start when idle, restart once the crash clears.
      if (!r.playing) {
        r.handleJumpStart();
        return;
      }

      var trex = r.trex;

      // The player always wins. While a key is held, stand down completely.
      if (r.manualControl) return;

      // Mid-air the arc is mostly committed, but the down key still works, and
      // it is the one move left: falling fast drops under a high pterodactyl
      // and lands sooner, which can buy back the frames needed to re-jump
      // before the next obstacle arrives.
      if (trex.jumping) {
        if (!trex.speedDrop && !this.recoverable(false) && this.recoverable(true)) {
          trex.setSpeedDrop();
        }
        return;
      }

      if (this.survives('run', 0)) {
        if (trex.ducking) trex.setDuck(false);
        return;
      }

      if (this.survives('duck', 0)) {
        if (!trex.ducking) trex.setDuck(true);
        return;
      }

      // Anything else has to be jumped, so stand up first.
      if (trex.ducking) trex.setDuck(false);

      // There is a window of frames in which starting a jump clears the
      // obstacle: jump before it and the T-Rex lands in front of the obstacle,
      // jump after it and it never gets off the ground. Waiting keeps the
      // options open, so hold on until only LATE_CUSHION frames of that window
      // are left. Every delay tested here already had to survive both obstacle
      // speeds, so the far edge is a measured limit rather than a guess.
      if (this.survives('jump', 0)) {
        if (this.slack() <= LATE_CUSHION) {
          this.jump();
        }
        return;
      }

      // No plan is provably safe. If the hit is about to land, jumping is
      // still a better bet than running into it.
      if (!this.survives('run', 0, 4)) {
        this.jump();
      }
    },

    jump: function () {
      var r = this.runner;
      r.sound.jump();
      r.trex.startJump(r.currentSpeed);
    }
  };

  global.Autopilot = Autopilot;
})(window);

<script>
/*
 * game.js -- an offline-runner clone.
 *
 * Physics, speed curve, obstacle spacing, scoring and the night-mode cycle are
 * tuned to match the feel of the original browser offline game. All artwork
 * comes from sprites.js and is generated at runtime.
 */

(function (global) {
  'use strict';

  // ------------------------------------------------------------- Constants --

  var FPS = 60;
  var CANVAS_WIDTH = 600;
  var CANVAS_HEIGHT = 150;

  // Longest step a single frame may advance the world by: three frames' worth.
  var MAX_FRAME_TIME = 3 * (1000 / FPS);

  // The y the sprites stand on. The original works to a 150 tall canvas with a
  // 10px bottom pad, which puts the ground here.
  var GROUND_Y = 140;
  // The ground tile is 12 tall with its line on row 4, so drawing it here puts
  // that line on GROUND_Y - 2, just under the feet.
  var HORIZON_Y = 134;

  var CONFIG = {
    ACCELERATION: 0.001,
    BG_CLOUD_SPEED: 0.2,
    CLEAR_TIME: 3000,
    CLOUD_FREQUENCY: 0.5,
    GAMEOVER_CLEAR_TIME: 750,
    GAP_COEFFICIENT: 0.6,
    GRAVITY: 0.6,
    INVERT_FADE_DURATION: 12000,
    INVERT_DISTANCE: 700,
    MAX_CLOUDS: 6,
    MAX_OBSTACLE_LENGTH: 3,
    MAX_OBSTACLE_DUPLICATION: 2,
    MAX_SPEED: 13,
    SPEED: 6,
    SPEED_DROP_COEFFICIENT: 3
  };

    JUMP: { ' ': 1, 'ArrowUp': 1, 'Enter': 1, 'w': 1, 'W': 1 },

  };

    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  /**
   * A collision rectangle relative to an entity's top-left corner.
   * @constructor
   */
  function CollisionBox(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.width = w;
    this.height = h;
  }

    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;

    return new CollisionBox(box.x + x, box.y + y, box.width, box.height);
  }

  /**
   * Tiny WebAudio blip synthesiser. No audio files, no network.
   * @constructor
   */

  }

    /** Lazily create the audio context -- browsers require a user gesture. */

      if (Ctor) {
        this.ctx = new Ctor();

      if (this.ctx.state === 'suspended') this.ctx.resume();

      osc.frequency.setValueAtTime(freq, now);

      amp.connect(this.ctx.destination);

      setTimeout(function () { self.tone(1180, 1180, 0.09, 'square', 0.05); }, 90);

      WIDTH: 44,
      HEIGHT: 47,
      WIDTH_DUCK: 59,
      START_X_POS: 30,
      INITIAL_JUMP_VELOCITY: -10,
      DROP_VELOCITY: -5,
      MAX_JUMP_HEIGHT: 30,
      MIN_JUMP_HEIGHT: 30
    };

    // yPos as standing -- the crouch is where the ink sits in a 47 tall cell,
    // not a different position -- so its box is measured from there too.
    this.collisionBoxes = {
      RUNNING: [
        new CollisionBox(22, 0, 17, 16),
        new CollisionBox(1, 18, 30, 9),
        new CollisionBox(10, 35, 14, 8),
        new CollisionBox(1, 24, 29, 5),
        new CollisionBox(5, 30, 21, 4),
        new CollisionBox(9, 34, 15, 4)

      DUCKING: [new CollisionBox(1, 18, 55, 25)]

    this.groundYPos = GROUND_Y - this.config.HEIGHT;
    this.minJumpHeight = this.groundYPos - this.config.MIN_JUMP_HEIGHT;
    this.yPos = this.groundYPos;

    this.currentFrame = 0;
    this.msPerFrame = 1000 / 12;

    this.ducking = false;
    this.jumpVelocity = 0;
    this.reachedMinHeight = false;
    this.speedDrop = false;
    this.jumpCount = 0;
    this.crashed = false;

    this.blinkTimer = 0;
    this.blinking = false;

    this.status = 'WAITING';

  Trex.prototype = {
    nextBlinkDelay: function () {

    reset: function () {
      this.yPos = this.groundYPos;
      this.jumpVelocity = 0;
      this.jumping = false;
      this.ducking = false;
      this.crashed = false;
      this.speedDrop = false;
      this.jumpCount = 0;
      this.currentFrame = 0;
      this.timer = 0;
      this.status = 'RUNNING';

    setDuck: function (isDucking) {
      if (isDucking && !this.jumping) {
        this.ducking = true;

      this.jumping = true;
      this.status = 'JUMPING';

      this.reachedMinHeight = false;
      this.speedDrop = false;

    /** Cut the jump short when the key is released early. */
    endJump: function () {

          this.blinkTimer = 0;

      if (this.timer >= frameRate) {

      if (this.status === 'CRASHED') {
        image = sprites.trexCrashed;
      } else if (this.status === 'WAITING') {
        image = this.blinking ? sprites.trexWaiting : sprites.trexJumping;
      } else if (this.ducking) {
        image = this.currentFrame === 0 ? sprites.trexDuck1 : sprites.trexDuck2;
      } else if (this.jumping) {

     * @param {number} velocity starting vertical velocity

        y += Math.round(speedDrop ? vel * CONFIG.SPEED_DROP_COEFFICIENT : vel);
        vel += CONFIG.GRAVITY;

            reachedMin && vel < this.config.DROP_VELOCITY) {

  // Straight from dino_game/offline_sprite_definitions.ts: sizes, ground
  // positions, gaps and collision boxes are the original's own numbers.
  var OBSTACLE_TYPES = [
    {

      width: 25,

      multipleSpeed: 7,

      minSpeed: 0,

        new CollisionBox(8, 0, 7, 49),
        new CollisionBox(13, 10, 10, 38)

      height: 40,
      // Low, middle and high, as the original flies them.
      yPos: [100, 75, 50],
      multipleSpeed: 999,
      minSpeed: 8.5,
      minGap: 150,
      speedOffset: 0.8,
      numFrames: 2,
      frameRate: 1000 / 6,
      collisionBoxes: [
        new CollisionBox(15, 15, 16, 5),
        new CollisionBox(18, 21, 24, 6),
        new CollisionBox(2, 14, 4, 3),
        new CollisionBox(6, 10, 4, 7),
        new CollisionBox(10, 8, 6, 9)
      ]
    }
  ];

  /**
   * A single obstacle, possibly a group of 2-3 identical cacti.
   * @constructor
   */
  function Obstacle(canvasCtx, typeConfig, gapCoefficient, speed) {
    this.ctx = canvasCtx;
    this.typeConfig = typeConfig;
    this.gapCoefficient = gapCoefficient;

    this.size = randomNum(1, CONFIG.MAX_OBSTACLE_LENGTH);
    // Groups only appear once the game is fast enough to make them fair.
    if (this.size > 1 && typeConfig.multipleSpeed > speed) {
      this.size = 1;
    }

    this.width = typeConfig.width * this.size;
    this.xPos = CANVAS_WIDTH;
    this.remove = false;

    if (Array.isArray(typeConfig.yPos)) {
      this.yPos = typeConfig.yPos[randomNum(0, typeConfig.yPos.length - 1)];
    } else {
      this.yPos = typeConfig.yPos;
    }

    this.currentFrame = 0;
    this.timer = 0;

    this.gap = this.getGap(gapCoefficient, speed);

    // Pterodactyls fly slightly faster or slower than the ground speed.
    this.speedOffset = 0;
    if (typeConfig.speedOffset) {
      this.speedOffset = Math.random() > 0.5 ?
          typeConfig.speedOffset : -typeConfig.speedOffset;
    }
  }

  Obstacle.prototype = {
    getGap: function (gapCoefficient, speed) {
      var minGap = Math.round(
          this.width * speed + this.typeConfig.minGap * gapCoefficient);
      return randomNum(minGap, Math.round(minGap * 1.5));
    },

    update: function (deltaTime, speed) {
      if (this.remove) return;

      if (this.typeConfig.speedOffset) {
        speed += this.speedOffset;
      }
      this.xPos -= Math.floor((speed * FPS / 1000) * deltaTime);

      if (this.typeConfig.numFrames) {
        this.timer += deltaTime;
        if (this.timer >= this.typeConfig.frameRate) {
          this.currentFrame = (this.currentFrame + 1) % this.typeConfig.numFrames;
          this.timer = 0;
        }
      }

      if (this.xPos + this.width < 0) {
        this.remove = true;
      }
    },

    draw: function () {
      var sprites = global.Sprites.images;
      var name;
      if (this.typeConfig.spriteAlt && this.currentFrame === 1) {
        name = this.typeConfig.spriteAlt;
      } else {
        name = this.typeConfig.sprites[
            Math.min(this.size, this.typeConfig.sprites.length) - 1];
      }
      this.ctx.drawImage(sprites[name],
          Math.round(this.xPos), Math.round(this.yPos));
    },


    getCollisionBoxes: function () {
      var boxes = [];
      for (var i = 0; i < this.size; i++) {
        var offsetX = this.xPos + i * this.typeConfig.width;
        for (var j = 0; j < this.typeConfig.collisionBoxes.length; j++) {
          boxes.push(toWorld(this.typeConfig.collisionBoxes[j], offsetX, this.yPos));
        }
      }
      return boxes;
    },


    getBounds: function () {
      return new CollisionBox(this.xPos, this.yPos, this.width, this.typeConfig.height);
    }
  };

  // ---------------------------------------------------------------- Clouds --

  /** @constructor */
  function Cloud(canvasCtx, containerWidth) {
    this.ctx = canvasCtx;
    this.width = 46;
    this.height = 14;
    this.xPos = containerWidth;
    this.yPos = randomNum(20, 70);
    this.remove = false;
    this.cloudGap = randomNum(100, 400);
  }

  Cloud.prototype = {
    update: function (speed) {
      if (this.remove) return;
      this.xPos -= Math.ceil(speed);
      if (this.xPos + this.width < 0) {
        this.remove = true;
      }
    },

    draw: function () {
      this.ctx.drawImage(global.Sprites.images.cloud,
          Math.round(this.xPos), Math.round(this.yPos));
    }
  };

  // ----------------------------------------------------------- Horizon line --

  /**
   * The scrolling ground. Two tiles are generated procedurally and recycled,
   * so the terrain never visibly repeats.
   * @constructor
   */
  /**
   * The scrolling ground: the game's own two 600x12 tiles, alternating, which
   * is how the original avoids an obvious repeat.
   * @constructor
   */
  function HorizonLine(canvasCtx) {
    this.ctx = canvasCtx;
    this.tileWidth = CANVAS_WIDTH;
    this.tiles = [{ index: 0, xPos: 0 }, { index: 1, xPos: this.tileWidth }];
  }

  HorizonLine.prototype = {
    update: function (deltaTime, speed) {
      var increment = Math.floor(speed * (FPS / 1000) * deltaTime);
      var i;
      for (i = 0; i < this.tiles.length; i++) {
        this.tiles[i].xPos -= increment;
      }
      // Recycle whichever tile has scrolled fully off the left edge, swapping
      // to the other artwork as it goes back out in front.
      for (i = 0; i < this.tiles.length; i++) {
        if (this.tiles[i].xPos + this.tileWidth <= 0) {
          var other = this.tiles[(i + 1) % this.tiles.length];
          this.tiles[i].xPos = other.xPos + this.tileWidth;
          this.tiles[i].index = 1 - other.index;
        }
      }
    },

    draw: function () {
      var images = global.Sprites.images;
      for (var i = 0; i < this.tiles.length; i++) {
        this.ctx.drawImage(this.tiles[i].index === 0 ? images.horizon1 : images.horizon2,
            Math.round(this.tiles[i].xPos), HORIZON_Y);
      }
    },

    reset: function () {
      this.tiles[0].xPos = 0;
      this.tiles[0].index = 0;
      this.tiles[1].xPos = this.tileWidth;
      this.tiles[1].index = 1;
    }
  };

  // --------------------------------------------------------------- Horizon --

  /**
   * Owns the scenery and the obstacle queue.
   * @constructor
   */
  function Horizon(canvasCtx, gapCoefficient) {
    this.ctx = canvasCtx;
    this.gapCoefficient = gapCoefficient;
    this.obstacles = [];
    this.obstacleHistory = [];
    this.clouds = [];
    this.cloudFrequency = CONFIG.CLOUD_FREQUENCY;
    this.horizonLine = new HorizonLine(canvasCtx);
    // Seed the sky so the first few seconds are not empty.
    for (var i = 0; i < 3; i++) {
      this.addCloud();
      this.clouds[i].xPos = randomNum(0, CANVAS_WIDTH);
    }
  }

  Horizon.prototype = {
    update: function (deltaTime, currentSpeed, updateObstacles) {
      this.horizonLine.update(deltaTime, currentSpeed);
      this.updateClouds(deltaTime, currentSpeed);
      if (updateObstacles) {
        this.updateObstacles(deltaTime, currentSpeed);
      }
    },

    draw: function () {
      // Clouds sit behind everything else.
      for (var i = 0; i < this.clouds.length; i++) {
        this.clouds[i].draw();
      }
      this.horizonLine.draw();
      for (var j = 0; j < this.obstacles.length; j++) {
        this.obstacles[j].draw();
      }
    },

    updateClouds: function (deltaTime, speed) {
      var cloudSpeed = CONFIG.BG_CLOUD_SPEED / 1000 * deltaTime * speed;
      var numClouds = this.clouds.length;

      if (numClouds) {
        for (var i = numClouds - 1; i >= 0; i--) {
          this.clouds[i].update(cloudSpeed);
        }

        var last = this.clouds[numClouds - 1];
        if (numClouds < CONFIG.MAX_CLOUDS &&
            (CANVAS_WIDTH - last.xPos) > last.cloudGap &&
            this.cloudFrequency > Math.random()) {
          this.addCloud();
        }

        this.clouds = this.clouds.filter(function (cloud) {
          return !cloud.remove;
        });
      } else {
        this.addCloud();
      }
    },

    addCloud: function () {
      this.clouds.push(new Cloud(this.ctx, CANVAS_WIDTH));
    },

    updateObstacles: function (deltaTime, currentSpeed) {
      for (var i = 0; i < this.obstacles.length; i++) {
        this.obstacles[i].update(deltaTime, currentSpeed);
      }
      this.obstacles = this.obstacles.filter(function (obstacle) {
        return !obstacle.remove;
      });

      if (this.obstacles.length) {
        var last = this.obstacles[this.obstacles.length - 1];
        if (last && !last.followingObstacleCreated &&
            last.xPos + last.width + last.gap < CANVAS_WIDTH) {
          this.addNewObstacle(currentSpeed);
          last.followingObstacleCreated = true;
        }
      } else {
        this.addNewObstacle(currentSpeed);
      }
    },

    addNewObstacle: function (currentSpeed) {
      var typeIndex = randomNum(0, OBSTACLE_TYPES.length - 1);
      var typeConfig = OBSTACLE_TYPES[typeIndex];

      // Skip obstacles that are too fast for the current speed, or that would
      // repeat the same type too many times in a row.
      if (currentSpeed < typeConfig.minSpeed || this.duplicateObstacle(typeConfig.type)) {
        this.addNewObstacle(currentSpeed);
        return;
      }

      this.obstacles.push(
          new Obstacle(this.ctx, typeConfig, this.gapCoefficient, currentSpeed));

      this.obstacleHistory.unshift(typeConfig.type);
      if (this.obstacleHistory.length > 1) {
        this.obstacleHistory.splice(CONFIG.MAX_OBSTACLE_DUPLICATION);
      }
    },

    duplicateObstacle: function (type) {
      if (this.obstacleHistory.length < CONFIG.MAX_OBSTACLE_DUPLICATION) {
        return false;
      }
      for (var i = 0; i < CONFIG.MAX_OBSTACLE_DUPLICATION; i++) {
        if (this.obstacleHistory[i] !== type) {
          return false;
        }
      }
      return true;
    },

    reset: function () {
      this.obstacles = [];
      this.obstacleHistory = [];
      this.horizonLine.reset();
    }
  };

  // --------------------------------------------------------- Distance meter --

  /**
   * The score readout, including the high-score display and the flash that
   * fires every 100 points.
   * @constructor
   */
  function DistanceMeter(canvasCtx, canvasWidth) {
    this.ctx = canvasCtx;
    this.achievementDistance = 100;
    this.coefficient = 0.025;
    this.flashDuration = 1000 / 4;
    this.flashIterations = 6;

    this.currentDistance = 0;
    this.highScore = 0;

    this.flashingTimer = 0;
    this.flashIterationsLeft = 0;
    this.invertFlash = false;

    this.y = 10;
    this.minDigits = 5;
    // Both readouts are right-aligned to this edge, so a score that outgrows
    // five digits -- which a long hack-mode run will -- just extends leftwards
    // instead of being clipped.
    this.rightEdge = canvasWidth - 12;
  }

  DistanceMeter.prototype = {
    getActualDistance: function (distance) {
      return distance ? Math.round(distance * this.coefficient) : 0;
    },

    /**
     * @return {boolean} true when a 100-point milestone was just crossed.
     */
    update: function (deltaTime, distance) {
      var milestone = false;
      var value = this.getActualDistance(distance);

      if (this.flashIterationsLeft <= 0) {
        if (value > 0 && value % this.achievementDistance === 0 &&
            value !== this.currentDistance) {
          this.flashIterationsLeft = this.flashIterations;
          this.flashingTimer = 0;
          milestone = true;
        }
        this.currentDistance = value;
      } else {
        this.flashingTimer += deltaTime;
        if (this.flashingTimer >= this.flashDuration) {
          this.flashingTimer = 0;
          this.invertFlash = !this.invertFlash;
          this.flashIterationsLeft--;
          if (this.flashIterationsLeft <= 0) {
            this.invertFlash = false;
            this.currentDistance = value;
          }
        }
      }

      return milestone;
    },

    pad: function (value) {
      var str = String(value);
      while (str.length < this.minDigits) {
        str = '0' + str;
      }
      return str;
    },

    draw: function () {
      var score = this.pad(this.currentDistance);
      var scoreX = this.rightEdge - global.Sprites.measureText(score);

      // The score blinks off on alternate flash frames.
      if (!(this.flashIterationsLeft > 0 && this.invertFlash)) {
        global.Sprites.drawText(this.ctx, score, scoreX, this.y);
      }

      if (this.highScore > 0) {
        var hi = this.pad(this.highScore);
        var hiX = scoreX - 22 - global.Sprites.measureText(hi);
        var labelX = hiX - 12 - global.Sprites.measureText('HI');

        this.ctx.save();
        this.ctx.globalAlpha = 0.5;
        global.Sprites.drawText(this.ctx, 'HI', labelX, this.y);
        global.Sprites.drawText(this.ctx, hi, hiX, this.y);
        this.ctx.restore();
      }
    },

    setHighScore: function (distance) {
      this.highScore = this.getActualDistance(distance);
    },

    reset: function () {
      this.currentDistance = 0;
      this.flashIterationsLeft = 0;
      this.flashingTimer = 0;
      this.invertFlash = false;
    }
  };

  // -------------------------------------------------------- Game over panel --

  /** @constructor */
  /** @constructor */
  function GameOverPanel(canvasCtx) {
    this.ctx = canvasCtx;
    this.textY = 41;
    this.buttonY = 62;
  }

  GameOverPanel.prototype = {
    draw: function () {
      var images = global.Sprites.images;
      var text = images.gameOverText;
      var button = images.restart;

      this.ctx.drawImage(text,
          Math.round((CANVAS_WIDTH - text.width) / 2), this.textY);
      this.ctx.drawImage(button,
          Math.round((CANVAS_WIDTH - button.width) / 2), this.buttonY);
    }
  };

  // ---------------------------------------------------------------- Runner --

  /**
   * The game itself.
   * @constructor
   */
  function Runner(containerSelector) {
    this.container = document.querySelector(containerSelector);
    this.canvas = this.container.querySelector('canvas');
    this.ctx = this.canvas.getContext('2d');

    this.dimensions = { WIDTH: CANVAS_WIDTH, HEIGHT: CANVAS_HEIGHT };

    this.currentSpeed = CONFIG.SPEED;
    this.distanceRan = 0;
    this.highestScore = 0;
    this.runningTime = 0;
    this.msPerFrame = 1000 / FPS;
    this.time = 0;
    this.rafId = null;

    this.playing = false;
    this.crashed = false;

    this.inverted = false;
    this.invertTimer = 0;

    // True while the player is holding a jump or duck input. Hack mode stands
    // down entirely for as long as this is set.
    this.manualControl = false;
    this.heldJump = false;
    this.heldDuck = false;

    this.sound = new Sound();
    this.storageKey = 'offline-runner.highScore';
    this.modeKey = 'offline-runner.mode';

    this.setupCanvas();

    global.Sprites.build();

    this.trex = new Trex(this.ctx);
    this.horizon = new Horizon(this.ctx, CONFIG.GAP_COEFFICIENT);
    this.distanceMeter = new DistanceMeter(this.ctx, this.dimensions.WIDTH);
    this.gameOverPanel = new GameOverPanel(this.ctx);
    this.autopilot = new global.Autopilot(this);

    this.loadHighScore();
    this.bindEvents();
    this.bindSettings();
    this.play();
  }

  Runner.prototype = {
    /** Size the backing store for the display's pixel density. */
    /**
     * Match the backing store to however large the stylesheet is showing the
     * canvas, then stretch a fixed 600x150 drawing space over it.
     *
     * Everything else in the game -- physics, collision boxes, obstacle
     * positions -- works in that fixed space and never learns the window size,
     * so filling a 4K screen plays exactly like a phone.
     */
    setupCanvas: function () {
      var dpr = global.devicePixelRatio || 1;
      var availWidth = this.container.clientWidth || global.innerWidth;
      var availHeight = global.innerHeight;

      // Snap to a whole-number scale. Stretching to fill the window exactly
      // means one game pixel covers a fractional number of screen pixels, so
      // every edge lands on a partial pixel and gets blended -- which on a
      // subpixel display shows up as a colour fringe along every dark edge.
      // An integer scale makes each game pixel an exact square block instead.
      var scale = Math.floor(Math.min(
          availWidth * dpr / this.dimensions.WIDTH,
          availHeight * dpr / this.dimensions.HEIGHT));
      scale = Math.max(1, scale);

      var backingWidth = this.dimensions.WIDTH * scale;
      var backingHeight = this.dimensions.HEIGHT * scale;

      this.canvas.width = backingWidth;
      this.canvas.height = backingHeight;
      // Sized so the backing store maps to device pixels one for one; the
      // browser then has nothing left to resample.
      this.canvas.style.width = (backingWidth / dpr) + 'px';
      this.canvas.style.height = (backingHeight / dpr) + 'px';

      this.ctx.setTransform(scale, 0, 0, scale, 0, 0);
      this.ctx.imageSmoothingEnabled = false;
    },

    /** Re-fit after the window changes size or the device rotates. */
    handleResize: function () {
      var self = this;
      if (this.resizeTimer) global.clearTimeout(this.resizeTimer);
      this.resizeTimer = global.setTimeout(function () {
        self.resizeTimer = null;
        self.setupCanvas();
        self.draw();
      }, 80);
    },

    loadHighScore: function () {
      try {
        var stored = global.localStorage.getItem(this.storageKey);
        if (stored) {
          this.highestScore = parseFloat(stored) || 0;
          this.distanceMeter.setHighScore(this.highestScore);
        }
      } catch (e) {
        // Private browsing or blocked storage -- run without a saved score.
      }
    },

    saveHighScore: function () {
      try {
        global.localStorage.setItem(this.storageKey, String(this.highestScore));
      } catch (e) {
        // Ignore.
      }
    },

    // -------------------------------------------------------------- Input --

    bindEvents: function () {
      var self = this;

      document.addEventListener('keydown', function (e) { self.onKeyDown(e); });
      document.addEventListener('keyup', function (e) { self.onKeyUp(e); });

      this.canvas.addEventListener('pointerdown', function (e) { self.onPointerDown(e); });
      this.canvas.addEventListener('pointerup', function (e) { self.onPointerUp(e); });
      this.canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      global.addEventListener('resize', function () { self.handleResize(); });
      global.addEventListener('orientationchange', function () { self.handleResize(); });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          self.stop();
        } else if (!self.crashed) {
          // Resume whether a run is in progress or the T-Rex is idling.
          self.play();
        }
      });
    },

    // ----------------------------------------------------------- Settings --

    bindSettings: function () {
      var self = this;

      this.settings = this.container.querySelector('.settings');
      if (!this.settings) return;

      this.settingsToggle = this.settings.querySelector('.settings__toggle');
      this.settingsPanel = this.settings.querySelector('.settings__panel');
      this.settingsBadge = this.settings.querySelector('.settings__badge');
      this.modeInputs = this.settings.querySelectorAll('input[name="mode"]');

      this.settingsToggle.addEventListener('click', function () {
        self.openSettings(self.settingsPanel.hidden);
      });

      for (var i = 0; i < this.modeInputs.length; i++) {
        this.modeInputs[i].addEventListener('change', function () {
          if (!this.checked) return;
          self.setMode(this.value);
          // Close and hand focus back, otherwise the radio keeps it and eats
          // the spacebar the player expects to jump with.
          self.openSettings(false);
          this.blur();
        });
      }

      // A click anywhere else closes the panel.
      document.addEventListener('pointerdown', function (e) {
        if (!self.settings.contains(e.target)) self.openSettings(false);
      }, true);

      var saved = 'normal';
      try {
        saved = global.localStorage.getItem(this.modeKey) || 'normal';
      } catch (e) {
        // Storage unavailable -- start in normal mode.
      }
      this.setMode(saved === 'hack' ? 'hack' : 'normal');
    },

    openSettings: function (open) {
      if (!this.settingsPanel) return;
      this.settingsPanel.hidden = !open;
      this.settingsToggle.setAttribute('aria-expanded', String(open));
    },

    /**
     * @param {string} mode 'normal' or 'hack'
     */
    setMode: function (mode) {
      var hack = mode === 'hack';
      this.mode = hack ? 'hack' : 'normal';
      this.autopilot.enabled = hack;

      for (var i = 0; i < this.modeInputs.length; i++) {
        this.modeInputs[i].checked = this.modeInputs[i].value === this.mode;
      }
      if (this.settingsBadge) this.settingsBadge.hidden = !hack;
      this.container.classList.toggle('hacking', hack);

      try {
        global.localStorage.setItem(this.modeKey, this.mode);
      } catch (e) {
        // Ignore.
      }

      // Turning hack mode on from a crash screen should pick the game back up.
      if (hack && this.crashed) {
        this.scheduleAutoRestart();
      }
    },

    /** In hack mode a crash is only ever a pause. */
    scheduleAutoRestart: function () {
      var self = this;
      if (this.autoRestartTimer) global.clearTimeout(this.autoRestartTimer);
      this.autoRestartTimer = global.setTimeout(function () {
        self.autoRestartTimer = null;
        if (self.autopilot.enabled && self.crashed) self.restart();
      }, CONFIG.GAMEOVER_CLEAR_TIME + 250);
    },

    onKeyDown: function (e) {
      if (e.repeat) return;
      // While the panel is open its own controls own the keyboard.
      if (this.settingsPanel && !this.settingsPanel.hidden &&
          this.settings.contains(e.target)) {
        if (e.key === 'Escape') this.openSettings(false);
        return;
      }
      this.sound.init();

      if (KEYCODES.JUMP[e.key]) {
        e.preventDefault();
        this.heldJump = true;
        this.manualControl = true;
        this.handleJumpStart();
      } else if (KEYCODES.DUCK[e.key]) {
        e.preventDefault();
        this.heldDuck = true;
        this.manualControl = true;
        this.handleDuckStart();
      } else if (e.key === 'm' || e.key === 'M') {
        this.sound.muted = !this.sound.muted;
        this.setStateClass('muted', this.sound.muted);
      } else if (e.key === 'Escape') {
        this.openSettings(false);
      }
    },

    onKeyUp: function (e) {
      if (KEYCODES.JUMP[e.key]) {
        this.heldJump = false;
        this.handleJumpEnd();
      } else if (KEYCODES.DUCK[e.key]) {
        this.heldDuck = false;
        this.handleDuckEnd();
      }
      this.manualControl = this.heldJump || this.heldDuck;
    },

    onPointerDown: function (e) {
      e.preventDefault();
      this.sound.init();

      var rect = this.canvas.getBoundingClientRect();
      var y = (e.clientY - rect.top) * (this.dimensions.HEIGHT / rect.height);

      this.openSettings(false);
      this.manualControl = true;

      if (this.crashed) {
        this.handleJumpStart();
        return;
      }

      // Touching the lower quarter of the canvas ducks instead of jumping.
      if (this.playing && y > this.dimensions.HEIGHT * 0.72) {
        this.heldDuck = true;
        this.handleDuckStart();
      } else {
        this.heldJump = true;
        this.handleJumpStart();
      }
    },

    onPointerUp: function () {
      this.heldJump = false;
      this.heldDuck = false;
      this.manualControl = false;
      this.handleJumpEnd();
      this.handleDuckEnd();
    },

    handleJumpStart: function () {
      if (this.crashed) {
        // A short delay so you cannot restart by accident on the crash frame.
        if (global.performance.now() - this.crashTime >= CONFIG.GAMEOVER_CLEAR_TIME) {
          this.restart();
        }
        return;
      }

      if (!this.playing) {
        this.startGame();
      }

      if (!this.trex.jumping && !this.trex.ducking) {
        this.sound.jump();
        this.trex.startJump(this.currentSpeed);
      }
    },

    handleJumpEnd: function () {
      if (this.playing && this.trex.jumping) {
        this.trex.endJump();
      }
    },

    handleDuckStart: function () {
      if (!this.playing || this.crashed) return;

      if (this.trex.jumping) {
        this.trex.setSpeedDrop();
      } else {
        this.trex.setDuck(true);
      }
    },

    handleDuckEnd: function () {
      if (this.trex.ducking) {
        this.trex.setDuck(false);
      }
      this.trex.speedDrop = false;
    },

    // ------------------------------------------------------- Game control --

    startGame: function () {
      this.playing = true;
      this.crashed = false;
      this.runningTime = 0;
      this.trex.reset();
      this.setStateClass('playing', true);
      this.play();
    },

    restart: function () {
      this.runningTime = 0;
      this.playing = true;
      this.crashed = false;
      this.distanceRan = 0;
      this.currentSpeed = CONFIG.SPEED;
      this.invertTimer = 0;
      this.setInverted(false);
      this.distanceMeter.reset();
      this.horizon.reset();
      this.trex.reset();
      this.setStateClass('playing', true);
      this.play();
    },

    play: function () {
      if (this.crashed) return;
      this.stop();
      this.time = global.performance.now();
      this.scheduleNextUpdate();
    },

    stop: function () {
      if (this.rafId) {
        global.cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }
    },

    scheduleNextUpdate: function () {
      // Idempotent on purpose. update() can reach play() indirectly -- hack
      // mode starting a run is the usual way -- and without this guard that
      // path leaves two request-animation-frame loops running against one
      // shared clock, halving every deltaTime and breaking jump physics.
      if (this.rafId !== null) return;

      var self = this;
      this.rafId = global.requestAnimationFrame(function (now) {
        self.rafId = null;
        self.update(now);
      });
    },

    gameOver: function () {
      this.sound.hit();
      this.stop();
      this.crashed = true;
      this.playing = false;
      this.crashTime = global.performance.now();
      this.trex.status = 'CRASHED';
      this.trex.crashed = true;
      this.setStateClass('playing', false);

      if (this.distanceRan > this.highestScore) {
        this.highestScore = Math.ceil(this.distanceRan);
        this.distanceMeter.setHighScore(this.highestScore);
        this.saveHighScore();
      }

      this.draw();

      if (this.autopilot.enabled) {
        this.scheduleAutoRestart();
      }
    },

    // -------------------------------------------------------------- Frame --

    update: function (now) {
      // Clamp the step so a stalled frame cannot teleport the world forward.
      // At 100ms an obstacle moves most of a T-Rex width in a single tick,
      // which is unreactable for a player and unplannable for hack mode; three
      // frames' worth means a hitch briefly slows the game instead.
      var deltaTime = Math.min(now - this.time, MAX_FRAME_TIME);
      this.time = now;

      // Decide before the world moves, exactly where a keypress would land.
      this.autopilot.step();

      if (this.playing) {
        this.runningTime += deltaTime;
        var hasObstacles = this.runningTime > CONFIG.CLEAR_TIME;

        this.trex.update(deltaTime);
        this.horizon.update(deltaTime, this.currentSpeed, hasObstacles);

        if (hasObstacles && this.checkCollision()) {
          this.gameOver();
          return;
        }

        this.distanceRan += this.currentSpeed * deltaTime / this.msPerFrame;

        if (this.currentSpeed < CONFIG.MAX_SPEED) {
          this.currentSpeed += CONFIG.ACCELERATION;
        }

        if (this.distanceMeter.update(deltaTime, Math.ceil(this.distanceRan))) {
          this.sound.achievement();
        }

        this.updateInvert(deltaTime);
      } else {
        this.trex.update(deltaTime);
        this.horizon.update(deltaTime, 0, false);
      }

      this.draw();
      this.scheduleNextUpdate();
    },

    /** Flip to night mode every INVERT_DISTANCE points for a fixed spell. */
    updateInvert: function (deltaTime) {
      if (this.invertTimer > CONFIG.INVERT_FADE_DURATION) {
        this.invertTimer = 0;
        this.setInverted(false);
      } else if (this.invertTimer) {
        this.invertTimer += deltaTime;
      } else {
        var actualDistance =
            this.distanceMeter.getActualDistance(Math.ceil(this.distanceRan));
        if (actualDistance > 0 && actualDistance % CONFIG.INVERT_DISTANCE === 0) {
          this.invertTimer += deltaTime;
          this.setInverted(true);
        }
      }
    },

    /**
     * Mirror a state class onto the page as well as the canvas wrapper. The
     * settings and the hint sit outside the canvas now, and at night the page
     * itself has to darken with it or the game ends up in a lit border.
     */
    setStateClass: function (name, on) {
      this.container.classList.toggle(name, on);
      document.body.classList.toggle(name, on);
    },

    setInverted: function (inverted) {
      if (this.inverted === inverted) return;
      this.inverted = inverted;
      this.setStateClass('inverted', inverted);
    },

    checkCollision: function () {
      var obstacles = this.horizon.obstacles;
      if (!obstacles.length) return false;

      var trexBounds = this.trex.getBounds();

      for (var i = 0; i < obstacles.length; i++) {
        var obstacle = obstacles[i];
        // Cheap rejection before testing the detailed boxes.
        if (!boxesIntersect(trexBounds, obstacle.getBounds())) continue;

        var trexBoxes = this.trex.getCollisionBoxes();
        var obstacleBoxes = obstacle.getCollisionBoxes();

        for (var t = 0; t < trexBoxes.length; t++) {
          for (var o = 0; o < obstacleBoxes.length; o++) {
            if (boxesIntersect(trexBoxes[t], obstacleBoxes[o])) {
              return true;
            }
          }
        }
      }
      return false;
    },

    draw: function () {
      this.ctx.clearRect(0, 0, this.dimensions.WIDTH, this.dimensions.HEIGHT);
      this.horizon.draw();
      this.trex.draw();
      this.distanceMeter.draw();
      if (this.crashed) {
        this.gameOverPanel.draw();
      }
    }
  };

  global.Runner = Runner;

  document.addEventListener('DOMContentLoaded', function () {
    global.game = new Runner('.runner-container');
  });
})(window);
</script>
